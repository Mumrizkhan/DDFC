version: "3.9"

services:
  # ── SQL Server ────────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ddfc-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Pass2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Pass2026' -Q 'SELECT 1' -No"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── DDFC API ──────────────────────────────────────────────────────────────────
  ddfc-api:
    build:
      context: .
      dockerfile: src/DDFC.API/Dockerfile
    container_name: ddfc-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=DDFC;User Id=sa;Password=YourStrong!Pass2026;TrustServerCertificate=True;"
      Jwt__Key: "DDFCSecretKey2026!!DDFCSecretKey2026!!DDFCSecretKey2026"
      Jwt__Issuer: "DDFC"
      Jwt__Audience: "DDFCUsers"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver_data:
